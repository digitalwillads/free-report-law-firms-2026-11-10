}
* { box-sizing: border-box; }

/* A slow page: the page's own seconds on a clock; past 3 s, more than half of the visitors leave. */

/* A tag: one sale (or lead, or visit) on the site, the tag copies it passes, and what the account counts. */

      `<div class="gs-bar"><span class="gs-label">Shopping</span>${q ? `<span class="gs-q">${esc(q)}</span>` : ""}</div>` +
      `<div class="gs-grid">${e.rows.map(card).join("")}</div>` +
      (fold ? `<button type="button" class="more" data-more>Show all ${e.rows.length}</button>` : "") +
      (where ? `<p class="gs-cap">${esc(where)}</p>` : "") + `</div>`;
  };
  // A table shows its rows only: no legend and no note on how we measured (Will, 2026-11-09: "it talks a lot about how
  // it's working. Like we don't want that."). A table of listings with pictures is drawn as Google Shopping.
  const table = e => {
    if (!e || !Array.isArray(e.rows) || !e.rows.length) return "";
    if ((e.roles || []).includes("img")) return shopping(e);
    const show = e.show || e.rows.length, fold = e.rows.length > show, roles = e.roles || [];
    const head = (e.head || []).map((h, i) => `<th class="${esc(roles[i])}">${esc(h)}</th>`).join("");
    // The store's own row always shows, folded or not.
    // A row's picture is a file next to the report ("img/3.webp"); its product name links to the listing on Google.
    const cell = (r, c, role) => role === "img"
      ? `<td class="img">${/^img\/\d+\.(jpg|png|webp|gif)$/.test(r.img || "") ? `<img src="${esc(r.img)}" alt="" loading="lazy" width="48" height="48">` : ""}</td>`
      : role === "text" && safeUrl(r.link)
        ? `<td class="text"><a href="${esc(safeUrl(r.link))}" target="_blank" rel="noopener">${esc(c)}</a></td>`
        : `<td class="${esc(role)}">${esc(c)}</td>`;
    const body = e.rows.map((r, j) => `<tr class="${esc(r.cls || "")}${j >= show && r.cls !== "you" ? " extra" : ""}">` +
      (r.cells || []).map((c, i) => cell(r, c, roles[i])).join("") + `</tr>`).join("");
    return `<div class="ev${roles.includes("rank") ? "" : " norank"}${roles.includes("img") ? " withimg" : ""}${fold ? " folded" : ""}">` +
      (e.title ? `<div class="ev-bar">${esc(e.title)}</div>` : "") +
      `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` +
      (fold ? `<button type="button" class="more" data-more>Show all ${e.rows.length} rows</button>` : "") + `</div>`;
  };
  // Real ads of the competitors: the picture the check saved ("img/4.jpg") and the ad's words (the builder leaves out
  // words read from a picture by OCR); the company; since when; its page in its ad library.
  const adCards = f => !Array.isArray(f.ads) || !f.ads.length ? "" :
    `<p class="ads-h">Some of their live ads</p><div class="ads">` + f.ads.map(a => {
      const pic = /^img\/\d+\.(jpg|png|webp|gif)$/.test(a.img || "");
      return `<figure class="ad">` + (pic ? `<img src="${esc(a.img)}" alt="An ad of ${esc(a.company)}" loading="lazy">` : "") +
        `<figcaption><b>${esc(a.company)}</b><span>${esc([a.kind, a.since].filter(Boolean).join(", "))}</span>` +
        (a.words ? `<q>${esc(a.words)}</q>` : "") +
        (safeUrl(a.link) ? `<a href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener">See it in its ad library ↗</a>` : "") +
        `</figcaption></figure>`;
    }).join("") + `</div>`;
  // The business's newest Google reviews, as Google shows them (Will, 2026-11-09: "can we pull in their reviews?"): a
  // letter in a colored circle for the reviewer, the stars and the day, the words, and the owner's reply or "No reply".
  const AVATAR = ["#1a73e8", "#e8710a", "#188038", "#d93025", "#9334e6", "#007b83", "#c5221f", "#5f6368"];
  const avatar = n => AVATAR[[...String(n)].reduce((k, ch) => k + ch.codePointAt(0), 0) % AVATAR.length];
  const reviewCards = f => !Array.isArray(f.reviews) || !f.reviews.length ? "" :
    `<div class="rv">` + f.reviews.map(r => `<div class="rv-item">` +
      `<div class="rv-who"><span class="rv-av" style="background:${avatar(r.name)}" aria-hidden="true">${esc((String(r.name || "?").trim()[0] || "?").toUpperCase())}</span>` +
      `<span><b>${esc(r.name)}</b><span class="rv-meta">${gStars(r.stars)}${r.date ? `<span>${esc(r.date)}</span>` : ""}</span></span></div>` +
      (r.text ? `<p class="rv-text">${esc(r.text)}</p>` : "") +
      (r.reply ? `<div class="rv-reply"><b>Response from the owner</b><p>${esc(r.reply)}</p></div>` : `<span class="rv-none">No reply</span>`) +
      `</div>`).join("") + `</div>`;
  const facts = f => !Array.isArray(f.facts) ? "" :
    `<div class="facts">` + f.facts.map(([n, w]) => `<div><b>${esc(n)}</b><span>${esc(w)}</span></div>`).join("") + `</div>` +
    (f.facts_note ? `<p class="facts-note">${esc(f.facts_note)}</p>` : "");
  const check = f => {
    const links = (f.proof || []).filter(p => safeUrl(p.link));
    return links.length ? `<p class="check">Check it yourself:` +
      links.map(p => `<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${esc(p.label)} ↗</a>`).join("") + `</p>` : "";
  };

  // "Who shows up before you": the advertisers check's results pages (and Google Shopping for a store). Numbers only
  // from that data; a read that failed says "not read", never "none".
  const num = x => Number(x).toLocaleString("en-US");
  const plural = (k, one, many) => `${num(k)} ${k === 1 ? one : many}`;
  // Google's ad library is read by web address: a business can advertise under another one, so a zero is "none found",
  // never "no ads" (2026-11-09).
  // Will, 2026-11-09: "Don't show it if it's not there." A read that failed shows nothing, never "not read".
  const google = g => g == null ? "" : g === 0 ? "Google: none found in 30 days" : `Google: ${plural(g, "ad", "ads")} in 30 days`;
  const meta = (m, more) => m == null ? "" : m === 0 ? "Meta: no live ads" : `Meta: ${more ? "at least " : ""}${plural(m, "live ad", "live ads")}`;
  const ads = (g, m, more) => [google(g), meta(m, more)].filter(Boolean).join(" · ");
  const placeWords = p => {
    const parts = String(p || "").split(",").map(s => s.trim()).filter(Boolean);
    if (!parts.length) return "";
    if (parts.length === 1) return parts[0] === "United States" ? "the United States" : parts[0];
    return parts.slice(0, parts[parts.length - 1] === "United States" ? -1 : undefined).join(", ");
  };
  // Shown only when the buyers' searches ran (the section list leaves it out otherwise).
  // Each search's page as Google showed it on a phone (Will, 2026-11-09: "can we make it look like there are screenshots
  // of their ads ... what exactly it would look like on the map and on the searches"): its ads, Google's map for a local
  // service business, and its first free results, in Google's order. Every entry is one the page showed; nothing is
  // added. The business is marked "You"; a competitor carries its Google ad count.
  // A saved picture of this report ("img/12.png"): a site's icon, a map business's photo. No outside address is drawn.
  const gPic = u => /^img\/\d+\.(jpg|png|webp|gif)$/.test(u || "");
  const gFav = e => `<span class="g-fav" aria-hidden="true">${gPic(e.icon) ? `<img src="${esc(e.icon)}" alt="" width="18" height="18">` : esc((String(e.name || e.domain || "?").trim()[0] || "?").toUpperCase())}</span>`;
  const gMark = e => e.you ? `<span class="g-you">You</span>` :
    e.rival ? `<span class="g-rival">Competitor${e.google_ads ? ` · ${esc(plural(e.google_ads, "Google ad", "Google ads"))} in 30 days` : ""}</span>` : "";
  const gEntry = (e, ad) => `<div class="g-item${e.you ? " is-you" : e.rival ? " is-rival" : ""}">` + (ad ? `<div class="g-sp">Sponsored</div>` : "") +
    `<div class="g-site">${gFav(e)}<span class="g-who"><span class="g-name">${esc(e.name)}</span><span class="g-url">${esc(e.domain)}</span></span></div>` +
    (e.title ? `<div class="g-title">${esc(e.title)}</div>` : "") + (e.description ? `<div class="g-desc">${esc(e.description)}</div>` : "") + gMark(e) + `</div>`;
  const gStars = s => { const k = Math.max(0, Math.min(5, Math.round(Number(s)))); return `<span class="g-stars" aria-hidden="true">${"★".repeat(k)}${"☆".repeat(5 - k)}</span>`; };
  // A map business as Google Maps shows it: name, stars, category and address, and its photo on the right.
  const gPlace = e => `<div class="g-place${e.you ? " is-you" : ""}"><div class="g-ptext"><span class="g-pname">${esc(e.name)}</span>` +
    (e.stars != null ? `<span class="g-rate">${Number(e.stars).toFixed(1)} ${gStars(e.stars)}${e.reviews != null ? ` (${esc(num(e.reviews))})` : ""}</span>` : "") +
    ([e.category, e.address].some(Boolean) ? `<span class="g-pinfo">${esc([e.category, e.address].filter(Boolean).join(" · "))}</span>` : "") +
    (e.you ? `<span class="g-you">You</span>` : "") + `</div>` +
    (gPic(e.image) ? `<img class="g-photo" src="${esc(e.image)}" alt="" loading="lazy">` : "") + `</div>`;
  const gMap = list => !list.length ? "" : `<div class="g-map"><div class="g-map-img" aria-hidden="true">` +
    list.slice(0, 3).map((_, i) => `<span class="g-pin g-pin${i}"></span>`).join("") + `</div>` + list.map(gPlace).join("") + `</div>`;
  const gPage = (p, i) => {
    const ads = p.ads || [], here = [...ads, ...(p.map || []), ...(p.organic || [])].some(e => e.you);
    // The page is drawn to its first free results: a business further down is never "not on this page".
    const note = here ? "" : p.you_rank != null ? `<div class="g-note">You show up further down this page.</div>` : `<div class="g-note bad">You are not on this page.</div>`;
    return `<div class="g-pagebox" data-page-box="${i}"${i ? " hidden" : ""}><div class="g-page">` +
      `<div class="g-search"><span class="g-glass" aria-hidden="true"></span><span>${esc(p.query)}</span></div>` +
      ads.filter(a => !a.bottom).map(a => gEntry(a, true)).join("") + gMap(p.map || []) +
      (p.organic || []).map(o => gEntry(o, false)).join("") + ads.filter(a => a.bottom).map(a => gEntry(a, true)).join("") + note +
      `</div></div>`;
  };
  const serp = (pages, place) => `<div class="g-wrap"><div class="g-chips" role="tablist" aria-label="Our searches">` +
    pages.map((p, i) => `<button type="button" class="g-chip" role="tab" aria-selected="${i === 0}" data-page="${i}">${esc(p.query)}</button>`).join("") +
    `</div>${pages.map(gPage).join("")}<p class="g-cap">Google on a phone${place ? `, in ${esc(place)}` : ""}, ${esc(d.date)}. Ads change by the hour.</p></div>`;

  // "People in <area> are searching for you", as Google's Keyword Planner shows it (Will, 2026-11-09: "Search volume is
  // showing me the competitors instead of showing me search volume"; "People in the name the area that it is, unless
  // it's nationwide, ... are searching for you"): the area's searches a month, what a click costs, and each buyer
  // search with its searches a month as a bar (the number at its tip) and its average cost per click, the keyword on
  // one line. Seen numbers only.
  // A click price in words, as the search volume check says it: cents under $10, whole dollars from $10.
  const usd = x => Number(x) < 10 ? `$${Number(x).toFixed(2)}` : `$${Math.round(Number(x))}`;
  const marketSection = m => {
    const rows = m.rows || [], top = Math.max(1, ...rows.map(r => Number(r.volume) || 0));
    return `<h2 class="headline">${m.area ? `People in ${esc(m.area)} are searching for you` : "People are searching for you"}</h2>` +
      `<div class="callout low"><span class="amount">${esc(num(m.searches))}</span><span class="label">searches a month</span></div>` +
      (m.cpc != null ? `<p class="explainer">The average cost per click here is ${esc(usd(m.cpc))}.</p>` : "") +
      (rows.length ? `<div class="kp"><div class="kp-head"><span class="kp-logo">Keyword Planner</span><span>Keyword ideas</span></div>` +
        `<table><thead><tr><th>Keyword</th><th>Searches a month</th><th class="num">Average cost per click</th></tr></thead><tbody>` +
        rows.map(r => `<tr><td class="kw">${esc(r.keyword)}</td>` +
          `<td class="vol"><span class="kp-cell"><span class="kp-bar" style="--f:${((Number(r.volume) || 0) / top).toFixed(4)}"></span><span class="kp-val">${esc(num(r.volume))}</span></span></td>` +
          `<td class="num${r.cpc == null ? " nil" : ""}">${r.cpc == null ? "-" : esc(usd(r.cpc))}</td></tr>`).join("") +
        `</tbody></table></div>` : "");
  };

  // A finding's animation (Will, 2026-11-09: "let's put an animation in here", "For the tracking ones, can we put some
  // little animations on it? So it understands what's going on."): the cause and what it costs, with the finding's own
  // numbers only. Each kind gives its class, its inside, its length in seconds, and its timeline: [seconds, the class to
  // add, what else to do].
  const anims = [];
  const figure = `<svg viewBox="0 0 16 20" width="16" height="20" fill="currentColor" aria-hidden="true"><circle cx="8" cy="5" r="4"/><path d="M0 20c0-5 3.6-8 8-8s8 3 8 8z"/></svg>`;
  const icon = d => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const cart = icon(`<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"/>`);
  const visitor = icon(`<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>`);
  // A slow page: a clock runs the page's own seconds; past 3 s more than half of the visitors leave (the finding's
  // words: "more than half of phone visitors leave a page that takes over 3 seconds"), so 6 of 10 go.
  const slowAnim = f => {
    const T = parseFloat(f.stat);
    if (!(T > 3)) return null;
    const leave = [3, 7, 0, 5, 9, 2], at = [0, .12, .25, .42, .6, .8].map(x => 3 + (T - 3) * x);
    return { cls: "spd", style: `--cut:${(3 / T * 100).toFixed(2)}%`, len: T + 3, still: T,
      inner: `<div class="spd-top"><div class="spd-people">${figure.repeat(10)}</div>` +
        `<div class="spd-clock"><span class="spd-time">0.0 s</span><span class="spd-shown">Your page shows</span></div></div>` +
        `<div class="spd-track"><div class="spd-fill"></div><span class="spd-tick"></span></div>` +
        `<div class="spd-marks"><span class="m0">0 s</span><span class="m3">3 s</span><span class="mT">${esc(f.stat)}</span><span class="spd-leave">More than half leave</span></div>`,
      setup: el => {
        const time = el.querySelector(".spd-time"), people = el.querySelectorAll(".spd-people svg");
        return { cues: [[3, "late"], ...at.map((t, i) => [t, null, () => people[leave[i]].classList.add("gone")]), [T, "shown"]],
          frame: t => { const s = Math.min(t, T); el.style.setProperty("--p", `${(s / T * 100).toFixed(2)}%`); time.textContent = `${s.toFixed(1)} s`; },
          reset: () => people.forEach(p => p.classList.remove("gone")) };
      } };
  };
  // A page that jumps: the tap goes for the button, a late picture pushes the button down, and the tap lands on the picture.
  const jumpAnim = () => ({ cls: "lj", len: 4.2,
    inner: `<div class="lj-page"><span class="lj-line h"></span><span class="lj-line"></span><span class="lj-line s"></span><span class="lj-pic"></span>` +
      `<span class="lj-btn"></span>${`<span class="lj-line"></span><span class="lj-line s"></span>`.repeat(3)}<span class="lj-tap"></span><span class="lj-wrong">Wrong tap</span></div>`,
    setup: el => {
      const btn = el.querySelector(".lj-btn"), aim = el.querySelectorAll(".lj-tap, .lj-wrong");
      // The tap aims where the button is before the picture loads.
      return { cues: [[.3, "s1"], [1, "s2"], [1.35, "s3"]], reset: () => aim.forEach(x => { x.style.top = `${btn.offsetTop + btn.offsetHeight / 2}px`; }) };
    } });
  // A tag: one sale (or lead, or visit) on the site runs through each copy of the tag to the account, which counts what
  // reaches it. No tag: it never reaches the account. The old Analytics code: it reaches an account that is switched off.
  const TAGS = {
    double_ads_tag: { tag: "Google Ads tag", copies: 2, to: "Google Ads counts" },
    double_analytics_tag: { what: "visit", tag: "Analytics tag", copies: 2, to: "Analytics counts" },
    no_conversion_tag: { tag: "No conversion tag", copies: 0, to: "Google Ads sees" },
    no_purchase_tracking: { what: "sale", tag: "No purchase tag", copies: 0, to: "Google Ads sees" },
    no_meta_pixel: { tag: "No Meta Pixel", copies: 0, to: "Meta sees" },
    old_analytics: { what: "visit", tag: "Old Analytics code", copies: 1, to: "Universal Analytics", off: "Switched off" },
  };
  const tagAnim = f => {
    const k = TAGS[f.kind], what = k.what || f.noun || "sale", of = n => `${n} ${what}${n === 1 ? "" : "s"}`;
    const wire = (w, r, end) => `<span class="tf-wire tf-w${w}${r ? " r2" : ""}${end === "cut" ? " cut" : end ? " end" : ""}">${end === "cut" ? "" : `<i class="tf-dot"></i>`}</span>`;
    const lane = r => k.copies === 0 ? wire(1, r, true) + `<span class="tf-tag no">${esc(k.tag)}</span>` + wire(2, r, "cut")
      : wire(1, r) + `<span class="tf-tag${k.off ? " old" : ""}${r ? " r2" : ""}">${esc(k.tag)}</span>` + wire(2, r, !!k.off);
    const cues = k.copies === 2 ? c => [[.2, "go1"], [.9, "hit"], [1, "go2"], [1.75, null, () => c(1)], [1.95, "bad", () => c(2)]]
      : k.copies === 0 ? () => [[.2, "go1"], [.95, "lost"]] : () => [[.2, "go1"], [.9, "hit"], [1, "go2"], [1.75, "lost"]];
    return { cls: `tf${k.copies === 2 ? " two" : ""}`, len: k.copies === 0 ? 3.4 : 4.4,
      inner: `<div class="tf-box tf-src">${what === "sale" ? cart : visitor}<b>1 ${esc(what)}</b><small>on your site</small></div>` +
        lane(false) + (k.copies === 2 ? lane(true) : "") +
        `<div class="tf-box tf-dst"><small>${esc(k.to)}</small><b class="tf-count">${esc(k.off || of(0))}</b></div>`,
      setup: el => {
        const count = el.querySelector(".tf-count");
        const set = n => { count.textContent = of(n); count.classList.remove("pop"); void count.offsetWidth; count.classList.add("pop"); };
        return { cues: cues(set), reset: () => { count.textContent = k.off || of(0); count.classList.remove("pop"); } };
      } };
  };
  const animOf = f => {
    const a = f.kind === "slow_on_phones" ? slowAnim(f) : f.kind === "layout_jumps" ? jumpAnim() : TAGS[f.kind] ? tagAnim(f) : null;
    if (!a) return "";
    anims.push({ ...a, kind: f.kind });
    return `<div class="anim ${a.cls}" data-anim="${anims.length - 1}"${a.style ? ` style="${a.style}"` : ""} aria-hidden="true">${a.inner}</div>`;
  };
  // Plays an animation from its start while it is on screen, again and again; a reader who asks for less motion sees
  // its last frame.
  const player = (el, a) => {
    const s = a.setup(el), cues = s.cues.slice().sort((x, y) => x[0] - y[0]), classes = cues.map(q => q[1]).filter(Boolean);
    let raf = 0, t0 = 0, next = 0;
    const reset = () => {
      el.classList.add("a-reset");
      el.classList.remove(...classes);
      if (s.reset) s.reset();
      if (s.frame) s.frame(0);
      next = 0;
      void el.offsetWidth;
      el.classList.remove("a-reset");
    };
    const tick = now => {
      const t = (now - t0) / 1000;
      if (t >= a.len) { t0 = now; reset(); }
      else {
        while (next < cues.length && t >= cues[next][0]) { const [, c, fn] = cues[next++]; if (c) el.classList.add(c); if (fn) fn(); }
        if (s.frame) s.frame(t);
      }
      raf = requestAnimationFrame(tick);
    };
    return {
      start() { if (raf) return; reset(); t0 = performance.now(); raf = requestAnimationFrame(tick); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      end() { reset(); cues.forEach(([, c, fn]) => { if (c) el.classList.add(c); if (fn) fn(); }); if (s.frame) s.frame(a.still ?? a.len); },
    };
  };

  const whoSection = w => {
    // One heading: the tag above it said the same words (Will, 2026-11-09: "this is duplicated here at the top").
    const head = `<h2 class="headline">Who shows up before you on Google</h2>`;
    const n = w.searches, of = k => `${num(k)} of ${num(n)}`, rows = w.rows || [], top = rows[0], place = placeWords(w.place);
    const queries = (w.queries || []).map(x => typeof x === "string" ? x : (x && (x.query || x.keyword)) || "").filter(Boolean);
    let html = head;
    if (top) html += `<div class="callout medium"><span class="amount">${esc(of(top.before))}</span><span class="label">results pages show ${esc(top.name)} before you</span></div>`;
    // What we found leads (Will, 2026-11-09: "it talks a lot about how it's working ... we don't want that").
    html += `<p class="explainer">You showed up on ${esc(of(w.you.shows))} of these results pages.</p>`;
    const pages = Array.isArray(w.pages) ? w.pages.filter(p => p && p.query) : [];
    // Each search drawn as Google showed it: the buttons name the searches, so nobody reads them as a search for the
    // business's own name (Will, 2026-11-09).
    if (pages.length) html += serp(pages, place);
    // A report saved before the pages were kept: the searches and the lists, as they were.
    else if (queries.length) html += `<details class="searches"><summary>The ${esc(plural(queries.length, "search", "searches"))} we typed into Google</summary>` +
      `<p>${place ? `In ${esc(place)}, each` : "Each"} on a phone and on a computer: ${queries.map(x => `"${esc(x)}"`).join(", ")}.</p></details>`;
    // The lists are for a report with no drawn pages: the drawn pages show the same companies in place.
    if (!pages.length && rows.length) {
      html += table({ title: "Your competitors on these searches",
        head: ["", "Company", "Before you", "Their ads"], roles: ["rank", "main", "num", "text"],
        rows: rows.map((r, i) => ({ cells: [String(i + 1), r.name, of(r.before), ads(r.google_ads, r.meta_ads, r.meta_more)] }))
          .concat([{ cls: "you", cells: ["", `You (${w.you.name})`, `shows in ${of(w.you.shows)}`, ads(w.you.google_ads, w.you.meta_ads, w.you.meta_more)] }]),
        note: (w.also && w.also.length ? `Also on these searches: ${w.also.join(" · ")}. ` : "") + "Our searches can miss some ads, so the real counts can be higher." });
    } else if (!pages.length) {
      html += `<p class="none">No competitor showed up before you on these searches. Our searches can miss some ads.` +
        (w.also && w.also.length ? ` Also on these searches: ${esc(w.also.join(" · "))}.` : "") + `</p>`;
    }
    if (!pages.length && d.kind !== "store" && (w.map || []).length) {
      const stars = m => [m.stars != null ? `${Number(m.stars).toFixed(1)} stars` : "", m.reviews != null ? plural(m.reviews, "review", "reviews") : ""].filter(Boolean).join(", ");
      html += table({ title: "On the map",
        head: ["", "Business", "On the map", "Reviews"], roles: ["rank", "main", "num", "text"],
        rows: w.map.map((m, i) => ({ cells: [String(i + 1), m.name, of(m.shows), stars(m)] }))
          .concat([{ cls: "you", cells: ["", `You (${w.you.name})`, of(w.you.map_shows), ""] }]) });
    }
    const s = w.shopping;
    if (s && (s.rows || []).length) {
      const ofs = k => `${num(k)} of ${num(s.searches)}`;
      html += table({ title: "On Google Shopping",
        head: ["", "Store", "Before you", "Shows in"], roles: ["rank", "main", "num", "text"],
        rows: s.rows.map((r, i) => ({ cells: [String(i + 1), r.store, ofs(r.before), ofs(r.shows)] }))
          .concat([{ cls: "you", cells: ["", "You", `shows in ${ofs(s.you_show)}`, ""] }]) });
    }
    return html + check({ proof: w.links || [] });
  };

  const n = d.findings.length;
  // Will, 2026-11-09: "Don't show it if it's not there." A section with nothing to show is left out, menu and all.
  // What buyers search comes first, then who shows up for those searches.
  const secs = d.market ? [{ id: "market", nav: "Searching for you", sev: "", html: `<section class="sec" id="market">${marketSection(d.market)}</section>` }] : [];
  if (d.who && d.who.searches) secs.push({ id: "who", nav: "Who shows up before you", sev: "", html: `<section class="sec" id="who">${whoSection(d.who)}</section>` });
  secs.push(...d.findings.map((f, i) => ({ id: `s${i + 1}`, nav: f.nav || f.title, sev: f.severity || "medium",
    html: `<section class="sec" id="s${i + 1}">` +
      `<p class="sec-tag"><span class="dot ${esc(f.severity || "medium")}"></span>${i + 1} of ${n} · ${esc(f.nav || "")}</p>` +
      `<h2 class="headline">${esc(f.title || f.headline)}</h2>` +
      `<div class="callout ${esc(f.severity || "medium")}"><span class="amount">${esc(f.stat)}</span><span class="label">${esc(f.stat_label)}</span></div>` +
      animOf(f) +
      // The finding's words: what it costs, plus a fact the title and the number do not give (the builder leaves the
      // headline empty when it only repeats them).
      (f.headline || f.why ? `<p class="explainer">${esc([f.headline, f.why].filter(Boolean).join(" "))}</p>` : "") +
      table(f.table) + reviewCards(f) + adCards(f) + facts(f) +
      (f.fix ? `<div class="fix"><div class="fix-h"><span aria-hidden="true">🔧</span><span>How to fix it</span></div><p>${esc(f.fix)}</p></div>` : "") +
      check(f) + `</section>` })));
  // No "What to fix first" without a problem, and no "How we made this report" (Will, 2026-11-09: "Remove this.").
  const g = `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`;
  // Every report ends with the Google Ads audit, Huseyin's links too (Will, 2026-11-10: "I want audit.digitalwillads.com
  // to send them to get their google audit done next instead of the free fix").
  secs.push({ id: "next", nav: "Second audit", sev: "",
    html: `<section class="sec next" id="next"><div class="offer"><div class="tag">Second audit</div>` +
      `<h2 class="headline">Do you want a second audit, of your Google Ads?</h2>` +
      `<p>The first audit used public data only. The second one reads your Google Ads account and shows where the money goes.</p>` +
      `<ul><li><b>$</b>Searches you pay for that have nothing to do with you</li><li><b>📍</b>Ads that show outside your area</li>` +
      `<li><b>🔄</b>Changes Google made to your account without asking</li><li><b>📊</b>Tracking that counts the wrong things</li></ul>` +
      `<a class="gbtn" data-second href="/audit">${g}Yes, audit my Google Ads</a>` +
      `<p class="fine">Takes 2 minutes. Read-only: we never change your account.</p></div>` +
      `<p class="by">Prepared for ${esc(d.store.name)} by Digital Will Ads · ${esc(d.date)}</p></section>` });

  // What we assumed where the website did not say: one plain sentence each, above the first section.
  const assumed = Array.isArray(d.assumed) ? d.assumed.filter(Boolean) : [];
  const assumedBox = assumed.length ? `<div class="assumed" role="note"><b>What we assumed</b>${assumed.map(a => `<p>${esc(a)}</p>`).join("")}</div>` : "";
  // What we assumed is part of the first section: it shows with it.
  document.getElementById("sections").innerHTML = secs.map((s, i) => i === 0 && assumedBox ? s.html.replace(/^<section[^>]*>/, m => m + assumedBox) : s.html).join("");
  // Each section but the last ends with a button to the next one (phones have no side menu).
  const secEls = [...document.querySelectorAll("#sections > .sec")];
  secEls.forEach((el, i) => {
    const nx = secs[i + 1];
    if (!nx) return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "go-next";
    b.dataset.go = nx.id;
    b.textContent = `Next: ${nx.nav}`;
    el.appendChild(b);
  });
  document.getElementById("nav").innerHTML = secs.map((s, i) =>
    `<a href="#${s.id}" data-sec="${s.id}"><span class="num">${i + 1}</span><span class="dot ${esc(s.sev)}"></span><span>${esc(s.nav)}</span></a>`).join("");
  document.getElementById("side-store").textContent = d.store.name;
  document.getElementById("top-store").textContent = `${d.store.name} · ${d.date}`;
  // The second audit is this site's own Google sign-in page; only that path is taken from the data.
  // A report copied off the server (Huseyin's link) takes the live audit site's page.
  const second = /^(https:\/\/audit\.digitalwillads\.com)?\/audit\?site=[a-z0-9.-]+$/.test(String(d.second || "")) ? d.second : "/audit";
  document.querySelectorAll("[data-second]").forEach(a => {
    a.href = second;
    a.addEventListener("click", () => console.log("[free-report] second audit: clicked", { store: d.store.site, from: a.closest("#bar") ? "bar" : "offer" }));
  });

  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-more]");
    if (!b) return;
    const box = b.closest(".ev");
    box.classList.remove("folded");
    console.log("[free-report] rows: show all", { rows: box.querySelectorAll("tbody tr, .gs-card").length });
    b.remove();
  });
  // A search's button shows its drawn page.
  document.addEventListener("click", ev => {
    const c = ev.target.closest("[data-page]");
    if (!c) return;
    const wrap = c.closest(".g-wrap"), i = c.getAttribute("data-page");
    wrap.querySelectorAll("[data-page]").forEach(b => b.setAttribute("aria-selected", String(b === c)));
    wrap.querySelectorAll("[data-page-box]").forEach(box => { box.hidden = box.getAttribute("data-page-box") !== i; });
    console.log("[free-report] who: search shown", { query: c.textContent });
  });
  // One section at a time: the side menu, a Next button or the address (#id) picks it, and Back goes to the one before.
  // The bottom bar hides on the last section, which has its own button.
  const navLinks = [...document.querySelectorAll(".nav a")];
  const secIds = secs.map(s => s.id);
  const show = (id, how) => {
    if (!secIds.includes(id)) id = secIds[0];
    secEls.forEach(el => el.classList.toggle("on", el.id === id));
    navLinks.forEach(a => a.classList.toggle("on", a.dataset.sec === id));
    document.getElementById("bar").classList.toggle("hide", id === "next");
    window.scrollTo(0, 0);
    console.log("[free-report] section shown", { store: d.store.site, id, how });
    return id;
  };
  document.body.classList.add("one");
  document.addEventListener("click", ev => {
    const a = ev.target.closest(".nav a, [data-go]");
    if (!a) return;
    ev.preventDefault();
    const id = show(a.dataset.sec || a.dataset.go, a.dataset.go ? "next" : "menu");
    if (location.hash !== `#${id}`) history.pushState(null, "", `#${id}`);
  });
  window.addEventListener("popstate", () => show(location.hash.slice(1), "back"));
  window.addEventListener("hashchange", () => show(location.hash.slice(1), "address"));
  show(location.hash.slice(1), "start");
  // Each finding's animation plays while a third of it is on screen.
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const players = new Map([...document.querySelectorAll("[data-anim]")].map(el => [el, player(el, anims[Number(el.dataset.anim)])]));
  if (still) players.forEach(p => p.end());
  else {
    const onScreen = new IntersectionObserver(entries => entries.forEach(e => {
      const p = players.get(e.target);
      if (e.isIntersecting) p.start(); else p.stop();
    }), { threshold: 0.35 });
    players.forEach((_, el) => onScreen.observe(el));
  }
  console.log("[free-report] animations: ready", { store: d.store.site, kinds: anims.map(a => a.kind), still });

  console.log("[free-report] render: done", { store: d.store.site, sections: secs.length,
    tables: d.findings.filter(f => f.table).length, ad_cards: d.findings.reduce((k, f) => k + (Array.isArray(f.ads) ? f.ads.length : 0), 0),
    ms: Math.round(performance.now() - t0) });
})();
</script>
</body>
</html>
